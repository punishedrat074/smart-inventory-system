<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Primary Meta -->

    <meta
      name="description"
      content="Smart Inventory Management System — track stock, manage suppliers, record purchases and sales."

    <!-- Favicon placeholder — will be replaced with branded asset in a later task -->

      React mounts into this element.
      main.tsx throws a descriptive error if this element is missing,

    <!--
      Vite's entry point. The `type="module"` attribute is required for
      Vite's module-based dev server to work. Vite replaces this script
      reference in the production build with the hashed bundle filenames.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
